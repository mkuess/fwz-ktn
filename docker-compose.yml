Create a file `docker-compose.yml` in the project root with exactly this content:

services:
  app:
    build: .
    image: fwz-laravel
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fwz_db}
      MYSQL_USER: ${DB_USERNAME:-fwz_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

Also create a minimal `nginx.conf` in the project root if one doesn't already exist, that proxies PHP requests to the `app` container on port 9000 (PHP-FPM) for a standard Laravel `public/` document root setup.

Commit and push with the message "Add production docker-compose.yml".